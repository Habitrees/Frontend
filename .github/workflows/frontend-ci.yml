name: Frontend CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    env:
      VITE_ENABLE_AUTH_REGISTRATION_MOCK: "false"
      VITE_ENABLE_AUTH_RECOVERY_MOCK: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
