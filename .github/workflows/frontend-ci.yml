name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - chore/frontend-setup
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
